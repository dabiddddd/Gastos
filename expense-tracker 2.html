<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2f2f7" id="metaTheme">
<title>Gastos</title>
<link rel="manifest" href="./manifest.json">
<script>
/* Applied before first paint so the chosen theme never flashes the wrong colors. */
(function(){
  try {
    var t = localStorage.getItem("gastos_theme_v1") || "system";
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    var a = localStorage.getItem("gastos_accent_v1");
    if (a) {
      var s = document.documentElement.style;
      s.setProperty("--accent", a);
      s.setProperty("--accent-soft", "color-mix(in srgb, " + a + " 14%, transparent)");
    }
  } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --text-secondary: #8e8e93;
    --border: #e5e5ea;
    --accent: #d9822b;
    --accent-soft: rgba(217,130,43,0.1);
    --green: #34c759;
    --red: #ff3b30;
    --radius: 14px;
  }
  /* Manual dark. Wins over the system preference. */
  :root[data-theme="dark"] {
    --bg: #000000;
    --card: #1c1c1e;
    --text: #f2f2f7;
    --text-secondary: #8e8e93;
    --border: #2c2c2e;
    --accent: #ff9f0a;
    --accent-soft: rgba(255,159,10,0.15);
  }
  /* System dark, unless the user explicitly chose Light. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --text-secondary: #8e8e93;
      --border: #2c2c2e;
      --accent: #ff9f0a;
      --accent-soft: rgba(255,159,10,0.15);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh; padding-bottom: env(safe-area-inset-bottom);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  input, select, button, textarea { font-family: inherit; }
  input::placeholder { color: var(--text-secondary); }
  button { cursor: pointer; -webkit-appearance: none; appearance: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 0 40px; }

  /* Nav */
  .nav {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 0.5px solid var(--border);
    padding: 14px 20px 12px;
  }
  .nav-title { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 12px; }
  .segmented {
    display: flex; background: var(--border); border-radius: 9px; padding: 2px;
  }
  .seg-btn {
    flex: 1; border: none; background: transparent; padding: 6px 0;
    font-size: 13px; font-weight: 600; color: var(--text-secondary);
    border-radius: 7px; transition: all 0.2s;
  }
  .seg-btn.active { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

  .content { padding: 16px 16px 0; }

  /* Cards */
  .card {
    background: var(--card); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px;
  }
  .section-label {
    font-size: 12px; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.03em; margin: 20px 4px 8px;
  }
  .section-label:first-child { margin-top: 4px; }

  /* Add form */
  .amount-input-row { display: flex; align-items: baseline; gap: 4px; padding: 4px 0 14px; border-bottom: 0.5px solid var(--border); margin-bottom: 14px; }
  .peso-sign { font-size: 28px; font-weight: 600; color: var(--text-secondary); }
  #fAmount {
    border: none; background: transparent; font-size: 34px; font-weight: 700;
    color: var(--text); width: 100%; outline: none; letter-spacing: -0.02em;
  }
  .field-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 0; border-bottom: 0.5px solid var(--border);
  }
  .field-row:last-of-type { border-bottom: none; }
  .field-row-label { font-size: 15px; color: var(--text); }
  .field-row select, .field-row input {
    border: none; background: transparent; color: var(--text-secondary);
    /* 16px minimum, or iOS zooms the whole page when the field gets focus. */
    font-size: 16px; text-align: right; outline: none; max-width: 62%;
  }
  .field-row input[type="date"] { color: var(--text-secondary); }
  .field-row input::placeholder { text-align: right; }
  .field-hint {
    font-size: 12px; color: var(--text-secondary); text-align: right;
    padding: 0 0 10px; margin-top: -6px;
  }
  .btn-add {
    width: 100%; margin-top: 14px; background: var(--accent); border: none;
    border-radius: 12px; padding: 13px; color: white; font-weight: 600; font-size: 16px;
  }
  .btn-add:active { opacity: 0.7; }
  .btn-add:disabled { opacity: 0.35; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-card { background: var(--card); border-radius: var(--radius); padding: 16px; }
  .stat-card.wide { grid-column: 1 / -1; }
  .stat-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 6px; }
  .stat-value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }

  .chart-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  svg.chart { width: 100%; height: auto; display: block; }

  /* Category rows */
  .cat-row { margin-bottom: 14px; }
  .cat-row:last-child { margin-bottom: 0; }
  .cat-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; margin-bottom: 5px; background: transparent;
    border: none; width: 100%; padding: 0; color: var(--text); text-align: left;
  }
  .cat-name { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .chev { color: var(--text-secondary); font-size: 11px; margin-left: 6px; }
  .bar-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; }
  .sub-list { margin: 10px 0 2px 16px; padding-left: 10px; border-left: 1.5px solid var(--border); }
  .sub-row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; color: var(--text-secondary); padding: 3px 0;
  }
  .sub-row span:first-child { color: var(--text); }

  /* Split bars */
  .split-block { margin-bottom: 16px; }
  .split-block:last-child { margin-bottom: 0; }
  .split-title { font-size: 13px; font-weight: 600; margin-bottom: 7px; }
  .split-track { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--border); }
  .split-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }

  /* Filters */
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; }
  .chip {
    flex-shrink: 0; padding: 6px 14px; border-radius: 16px;
    background: var(--card); color: var(--text); font-size: 13px; font-weight: 500;
    border: 0.5px solid var(--border);
  }
  .chip.active { background: var(--accent); color: white; border-color: var(--accent); }
  .filter-summary { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; padding: 0 4px; }

  .entry-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 0.5px solid var(--border); }
  .entry-row:last-child { border-bottom: none; }
  .entry-note { font-size: 15px; font-weight: 500; }
  .entry-meta { font-size: 12px; color: var(--text-secondary); display: flex; gap: 6px; margin-top: 2px; flex-wrap: wrap; }
  .tag-pill { color: var(--accent); }
  .del-btn {
    background: transparent; border: none; color: var(--red); font-size: 20px;
    line-height: 1; padding: 11px 8px; margin: -11px -8px -11px 0; flex-shrink: 0;
  }
  .del-btn:active { opacity: 0.5; }

  /* -webkit-tap-highlight-color is off, so give keyboard users something. */
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .quick-tile:active { transform: none; }
  }
  .entry-amount { font-size: 15px; font-weight: 600; white-space: nowrap; }

  .empty { color: var(--text-secondary); font-size: 14px; text-align: center; padding: 36px 16px; }

  /* Settings row / export-import */
  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 0; border-bottom: 0.5px solid var(--border); gap: 12px;
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-label { font-size: 15px; }
  .settings-sub { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
  .btn-pill {
    background: var(--accent-soft); color: var(--accent); border: none;
    border-radius: 8px; padding: 7px 14px; font-size: 14px; font-weight: 600;
    white-space: nowrap;
  }
  .btn-pill.danger { background: rgba(255,59,48,0.1); color: var(--red); }
  #importFile { display: none; }

  /* Quick add */
  .quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .quick-tile {
    background: var(--card); border: 0.5px solid var(--border); border-radius: 12px;
    padding: 12px 13px; text-align: left; color: var(--text);
    display: flex; flex-direction: column; gap: 6px; transition: transform 0.12s, opacity 0.12s;
  }
  .quick-tile:active { transform: scale(0.97); opacity: 0.75; }
  .qt-top { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .qt-label {
    font-size: 14px; font-weight: 500; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .qt-amount { font-size: 17px; font-weight: 700; color: var(--accent); letter-spacing: -0.01em; }
  .quick-empty { color: var(--text-secondary); font-size: 14px; text-align: center; padding: 20px 8px; line-height: 1.45; }
  .link-btn {
    background: transparent; border: none; color: var(--accent);
    font-size: 14px; font-weight: 600; padding: 12px 0 2px; width: 100%;
  }
  .link-btn:active { opacity: 0.5; }

  /* Appearance */
  .settings-row.stack { display: block; }
  .swatch-row { display: flex; gap: 12px; overflow-x: auto; padding: 2px 0; }
  .swatch {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
    border: none; padding: 0; position: relative;
  }
  .swatch.active { box-shadow: 0 0 0 2.5px var(--bg), 0 0 0 4px var(--text); }
  .swatch-label { font-size: 11px; color: var(--text-secondary); margin-top: 8px; }

  .toast {
    position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px;
    font-size: 14px; font-weight: 500; opacity: 0; transition: opacity 0.25s;
    pointer-events: none; z-index: 100; white-space: nowrap;
    display: flex; align-items: center; gap: 16px; max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; }
  .toast.interactive { pointer-events: auto; }
  .toast-undo {
    background: transparent; border: none; color: inherit; font-size: 14px;
    font-weight: 700; text-decoration: underline; padding: 2px 0; flex-shrink: 0;
  }

  ::-webkit-scrollbar { display: none; }
</style>
</head>

/* Merged lookups so a category or subcategory resolves regardless of direction. */
const ALL_COLORS = Object.assign({}, CAT_COLORS, INCOME_COLORS);
const ALL_SUBCATS = Object.assign({}, SUBCATS, INCOME_SUBCATS);

function kindOf(e) { return e && e.kind === "in" ? "in" : "out"; }
function catsFor(kind) { return kind === "in" ? INCOME_CATEGORIES : CATEGORIES; }
function colorFor(cat) { return ALL_COLORS[cat] || CAT_COLORS.Other; }

const BUILD = "2026.08.14";
const STORE_KEY = "gastos_entries_v1";
const PRESET_KEY = "gastos_presets_v1";
const THEME_KEY = "gastos_theme_v1";
const ACCENT_KEY = "gastos_accent_v1";

const ACCENTS = [

  {id:"seed-commute", label:"Commute to school", amount:36, kind:"out", category:"Transport", sub:"Jeepney / tricycle", tags:[]},

function peso(n) {
  return "₱" + Number(n||0).toLocaleString("en-PH", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function todayStr() { return new Date().toISOString().slice(0,10); }
function monthKey(d) { return d.slice(0,7); }
function loadEntries() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e) { return []; }
}
function saveEntries(list) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(list));
    return true;
  } catch (e) {
    /* Quota exceeded, or storage blocked. Say so rather than appearing to save. */
    showToast("Couldn't save. Storage may be full.");
    return false;
  }
}
/* textContent to innerHTML escapes & < > but NOT quotes, and tags are free
   user text that gets written into data-tag="..." attributes. A tag containing
   a double quote would break out of the attribute and corrupt the markup. */
function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str == null ? "" : String(str);
  return d.innerHTML.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* Date.now() alone collides when two entries are created in the same
   millisecond, and delete filters by id, which would then remove both. */
let uidSeq = 0;
function uid() {
  uidSeq += 1;
  return Date.now().toString(36) + "-" + uidSeq.toString(36) + Math.random().toString(36).slice(2,6);
}

/* Amounts are displayed to 2 decimals, so store them that way. Otherwise a
   ₱36.999 entry displays as ₱37.00 but totals add up to something else. */
function money(v) {
  const n = Number(v);
  return isFinite(n) ? Math.round(n * 100) / 100 : 0;
}

/* Axis labels sit in 42px of gutter, so 25000 has to become 25k. */
function shortNum(n) {
  if (n >= 1000000) return (n/1000000).toFixed(n >= 10000000 ? 0 : 1).replace(/\.0$/,"") + "M";
  if (n >= 1000) return (n/1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/,"") + "k";
  return String(Math.round(n));
}
let toastTimer = null;
function hideToast() {
  const t = document.getElementById("toast");
  t.classList.remove("show");
  t.classList.remove("interactive");
}
function showToast(msg, undoFn) {
  const t = document.getElementById("toast");
  t.innerHTML = "";
  const label = document.createElement("span");
  label.textContent = msg;
  t.appendChild(label);
  if (undoFn) {
    const btn = document.createElement("button");
    btn.className = "toast-undo";
    btn.textContent = "Undo";
    btn.addEventListener("click", () => { undoFn(); hideToast(); });
    t.appendChild(btn);
    t.classList.add("interactive");
  } else {
    t.classList.remove("interactive");
  }
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, undoFn ? 4500 : 1800);
}

/* ---------- Theme ---------- */
function currentTheme() {

}
function currentAccent() {
  try { return localStorage.getItem(ACCENT_KEY) || ""; } catch(e) { return ""; }
}
function effectiveDark() {
  const t = currentTheme();
  if (t === "dark") return true;
  if (t === "light") return false;
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function syncMetaTheme() {
  const m = document.getElementById("metaTheme");
  if (m) m.setAttribute("content", effectiveDark() ? "#000000" : "#f2f2f7");
}
function applyTheme(t) {
  if (t === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(THEME_KEY, t); } catch(e) {}
  syncMetaTheme();
}
function applyAccent(hex) {
  const s = document.documentElement.style;
  if (hex) {
    s.setProperty("--accent", hex);
    s.setProperty("--accent-soft", "color-mix(in srgb, " + hex + " 14%, transparent)");
  } else {
    s.removeProperty("--accent");
    s.removeProperty("--accent-soft");
  }
  try {
    if (hex) localStorage.setItem(ACCENT_KEY, hex);
    else localStorage.removeItem(ACCENT_KEY);
  } catch(e) {}
}

/* ---------- Presets ---------- */
function loadPresets() {
  let stored = null;
  try { stored = localStorage.getItem(PRESET_KEY); } catch(e) {}
  if (stored === null) {
    savePresets(DEFAULT_PRESETS);
    return DEFAULT_PRESETS.slice();
  }
  try {
    const parsed = JSON.parse(stored);
    if (!Array.isArray(parsed)) return [];
    /* Presets saved before income existed have no kind. Default them to outgoing. */
    let changed = false;
    parsed.forEach(p => { if (p && p.kind !== "in" && p.kind !== "out") { p.kind = "out"; changed = true; } });
    if (changed) savePresets(parsed);
    return parsed;
  } catch(e) { return []; }
}
function savePresets(list) {
  try {
    localStorage.setItem(PRESET_KEY, JSON.stringify(list));
    return true;
  } catch(e) {
    showToast("Couldn't save. Storage may be full.");
    return false;
  }
}
function isIncome(e) { return kindOf(e) === "in"; }
function isSpend(e) { return kindOf(e) === "out" && NON_SPEND.indexOf(e.category) === -1; }
function isSetAside(e) { return kindOf(e) === "out" && NON_SPEND.indexOf(e.category) > -1; }
function subMeta(cat, sub) {
  if (!sub) return null;
  const list = ALL_SUBCATS[cat] || [];
  for (let i=0;i<list.length;i++) if (list[i].n === sub) return list[i];
  return null;
}
function pct(part, whole) { return whole > 0 ? (part/whole)*100 : 0; }

const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

/* Entries saved before subcategories and income existed are read correctly
   anyway, but normalising once on disk keeps the data unambiguous for any
   future export, import or backup. Also repairs anything malformed that an
   imported file might contain, since a missing date would otherwise crash
   monthKey() on the very next render. */
function normalizeEntries(list, persist) {
  let changed = false;
  const clean = [];
  list.forEach(e => {
    if (!e || typeof e !== "object") { changed = true; return; }
    if (e.kind !== "in" && e.kind !== "out") { e.kind = "out"; changed = true; }
    if (typeof e.id !== "string" || !e.id) { e.id = uid(); changed = true; }
    if (typeof e.sub !== "string") { e.sub = ""; changed = true; }
    if (typeof e.note !== "string") { e.note = ""; changed = true; }
    if (!Array.isArray(e.tags)) { e.tags = []; changed = true; }
    else if (e.tags.some(t => typeof t !== "string")) { e.tags = e.tags.filter(t => typeof t === "string"); changed = true; }
    const amt = money(e.amount);
    if (e.amount !== amt) { e.amount = amt; changed = true; }
    if (typeof e.date !== "string" || !DATE_RE.test(e.date)) { e.date = todayStr(); changed = true; }
    if (typeof e.category !== "string" || !e.category) {
      e.category = e.kind === "in" ? "Other Income" : "Other";
      changed = true;
    }
    clean.push(e);
  });
  if (changed && persist !== false) saveEntries(clean);
  return clean;
}

function logPreset(id) {
  let p = null;
  for (let i=0;i<presets.length;i++) if (presets[i].id === id) p = presets[i];
  if (!p) return;
  const entry = {
    id: uid(),
    amount: money(p.amount),
    kind: kindOf(p),
    category: p.category,
    sub: p.sub || "",
    note: p.label,
    tags: (p.tags || []).slice(),
    date: todayStr()
  };
  entries.unshift(entry);

  render();
  showToast(`${kindOf(p)==='in' ? 'Received' : 'Spent'} ${peso(p.amount)} · ${p.label}`, () => {
    const prev = entries;
    entries = entries.filter(e => e.id !== entry.id);
    if (!saveEntries(entries)) { entries = prev; return; }
    render();
  });
}

/* ---------- Charts (inline SVG, no deps) ---------- */
function buildLineChart(data, width, height) {
  if (data.length === 0) return `<div class="empty">No entries yet</div>`;
  const padL = 42, padB = 20, padT = 10, padR = 8;
  const w = width - padL - padR, h = height - padT - padB;
  const maxVal = Math.max(...data.map(d => d.amount), 1);
  const stepX = data.length > 1 ? w / (data.length - 1) : 0;
  const points = data.map((d,i) => [padL + i*stepX, padT + h - (d.amount/maxVal)*h]);
  const pathD = points.map((p,i) => (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const areaD = pathD + ` L${points[points.length-1][0].toFixed(1)},${(padT+h).toFixed(1)} L${points[0][0].toFixed(1)},${(padT+h).toFixed(1)} Z`;
  let gridLines = "";
  for (let i=0;i<=2;i++){
    const y = padT + (h/2)*i;
    const val = shortNum(maxVal - (maxVal/2)*i);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${width-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    gridLines += `<text x="${padL-6}" y="${y+3}" fill="var(--text-secondary)" font-size="9" text-anchor="end">${val}</text>`;
  }
  const labelEvery = Math.max(1, Math.ceil(data.length/5));
  let xLabels = "";
  data.forEach((d,i) => {
    if (i % labelEvery === 0 || i === data.length-1) {
      xLabels += `<text x="${points[i][0]}" y="${height-4}" fill="var(--text-secondary)" font-size="9" text-anchor="middle">${d.label}</text>`;
    }
  });
  return `<svg class="chart" viewBox="0 0 ${width} ${height}">
    ${gridLines}
    <path d="${areaD}" fill="var(--accent)" opacity="0.12"/>
    <path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${xLabels}
  </svg>`;
}
function buildGroupedBarChart(data, width, height) {
  if (data.length === 0) return `<div class="empty">Not enough data yet</div>`;
  const padL = 42, padB = 20, padT = 10, padR = 8;
  const w = width - padL - padR, h = height - padT - padB;
  const maxVal = Math.max(...data.map(d => Math.max(d.inAmt, d.outAmt)), 1);
  const gap = w / data.length;
  const bw = Math.min(gap * 0.28, 16);
  let bars = "";
  data.forEach((d,i) => {
    const centre = padL + i*gap + gap/2;
    [["inAmt","var(--green)",-1],["outAmt","var(--accent)",1]].forEach(spec => {
      const val = d[spec[0]];
      const barH = (val/maxVal)*h;
      const x = centre + (spec[2] === -1 ? -bw-1.5 : 1.5);
      const y = padT + h - barH;
      if (val > 0) bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(barH,2).toFixed(1)}" fill="${spec[1]}" rx="3"/>`;
    });
    bars += `<text x="${centre.toFixed(1)}" y="${height-4}" fill="var(--text-secondary)" font-size="9" text-anchor="middle">${d.month.slice(5)}</text>`;
  });
  let gridLines = "";
  for (let i=0;i<=2;i++){
    const y = padT + (h/2)*i;
    const val = shortNum(maxVal - (maxVal/2)*i);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${width-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    gridLines += `<text x="${padL-6}" y="${y+3}" fill="var(--text-secondary)" font-size="9" text-anchor="end">${val}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${width} ${height}">${gridLines}${bars}</svg>
    <div class="split-legend" style="margin-top:10px;">
      <div class="legend-item"><span class="dot" style="background:var(--green);"></span>In</div>
      <div class="legend-item"><span class="dot" style="background:var(--accent);"></span>Out</div>
    </div>`;
}

/* ---------- Breakdown by recurring / essential ---------- */
function buildSplit(title, segments, total) {
  const shown = segments.filter(s => s.value > 0);
  if (!shown.length) return "";
  return `
    <div class="split-block">
      <div class="split-title">${title}</div>
      <div class="split-track">
        ${shown.map(s=>`<div style="width:${pct(s.value,total)}%; background:${s.color};"></div>`).join("")}
      </div>
      <div class="split-legend">
        ${shown.map(s=>`
          <div class="legend-item">
            <span class="dot" style="background:${s.color};"></span>
            ${s.label} ${Math.round(pct(s.value,total))}% · <span class="mono">${peso(s.value)}</span>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}
function renderBreakdown(list) {
  const total = list.reduce((s,e)=>s+e.amount,0);
  if (!total) return "";
  let essential = 0, nonEssential = 0, recurring = 0, oneOff = 0, unclassified = 0;
  list.forEach(e => {
    const m = subMeta(e.category, e.sub);
    if (!m) { unclassified += e.amount; return; }
    if (m.e) essential += e.amount; else nonEssential += e.amount;
    if (m.r) recurring += e.amount; else oneOff += e.amount;
  });
  const gray = "var(--text-secondary)";
  return `
    <div class="section-label">How It Splits</div>
    <div class="card">
      ${buildSplit("Essential vs non-essential", [
        {label:"Essential", value:essential, color:"var(--green)"},
        {label:"Non-essential", value:nonEssential, color:"var(--accent)"},
        {label:"Unclassified", value:unclassified, color:gray}
      ], total)}
      ${buildSplit("Recurring vs one-off", [
        {label:"Recurring", value:recurring, color:"#0a84ff"},
        {label:"One-off", value:oneOff, color:"var(--accent)"},
        {label:"Unclassified", value:unclassified, color:gray}
      ], total)}
    </div>
  `;
}

/* ---------- Dashboard ---------- */
function renderDashboard() {
  const thisMonth = monthKey(todayStr());
  const spend = entries.filter(isSpend);
  const income = entries.filter(isIncome);
  const monthSpend = spend.filter(e => monthKey(e.date)===thisMonth);
  const monthIncome = income.filter(e => monthKey(e.date)===thisMonth);
  const monthTotal = monthSpend.reduce((s,e)=>s+e.amount,0);
  const monthIn = monthIncome.reduce((s,e)=>s+e.amount,0);
  const savedThisMonth = entries
    .filter(e => isSetAside(e) && monthKey(e.date)===thisMonth)
    .reduce((s,e)=>s+e.amount,0);
  const net = monthIn - monthTotal - savedThisMonth;
  const hasSavings = entries.some(isSetAside);
  const hasIncome = income.length > 0;

  const catMap = {};
  const subMap = {};
  monthSpend.forEach(e => {
    catMap[e.category] = (catMap[e.category]||0) + e.amount;
    const key = e.category + "|" + (e.sub || "Unspecified");
    subMap[key] = (subMap[key]||0) + e.amount;
  });
  /* Derived from the data, not from the CATEGORIES list. Mapping over the
     known list instead would silently drop any entry whose category is no
     longer recognised, so the bars would not add up to the total shown above. */
  const catTotals = Object.keys(catMap)
    .map(c => ({name:c, value:catMap[c]}))
    .filter(c => c.value > 0)
    .sort((a,b) => b.value - a.value);
  const maxCat = catTotals.length ? catTotals[0].value : 1;

  const srcMap = {};
  monthIncome.forEach(e => { srcMap[e.category] = (srcMap[e.category]||0) + e.amount; });
  const srcTotals = Object.keys(srcMap)
    .map(c => ({name:c, value:srcMap[c]}))
    .filter(c => c.value > 0)
    .sort((a,b) => b.value - a.value);
  const maxSrc = srcTotals.length ? srcTotals[0].value : 1;

  function subRowsFor(cat) {
    const rows = Object.keys(subMap)
      .filter(k => k.slice(0, cat.length+1) === cat + "|")
      .map(k => ({name:k.slice(cat.length+1), value:subMap[k]}))
      .sort((a,b)=>b.value-a.value);
    if (!rows.length) return "";
    return `<div class="sub-list">${rows.map(r=>`
      <div class="sub-row"><span>${escapeHtml(r.name)}</span><span class="mono">${peso(r.value)}</span></div>
    `).join("")}</div>`;
  }

  const dailyMap = {};
  spend.forEach(e => { dailyMap[e.date] = (dailyMap[e.date]||0) + e.amount; });
  const sortedDates = Object.keys(dailyMap).sort().slice(-30);
  const trendData = sortedDates.map(d => ({label: d.slice(5), amount: dailyMap[d]}));

  const monthMap = {};
  entries.forEach(e => {
    if (!isSpend(e) && !isIncome(e)) return;
    const mk = monthKey(e.date);
    if (!monthMap[mk]) monthMap[mk] = {inAmt:0, outAmt:0};
    if (isIncome(e)) monthMap[mk].inAmt += e.amount;
    else monthMap[mk].outAmt += e.amount;
  });
  const monthlyBars = Object.keys(monthMap).sort().slice(-6)
    .map(k => ({month:k, inAmt:monthMap[k].inAmt, outAmt:monthMap[k].outAmt}));

  const spentShare = monthIn > 0 ? Math.round(pct(monthTotal + savedThisMonth, monthIn)) : 0;

  const el = document.getElementById("dashboardView");
  el.innerHTML = `
    <div class="stats-grid">
      ${hasIncome ? `
      <div class="stat-card">
        <div class="stat-label">In This Month</div>
        <div class="stat-value mono" style="color:var(--green);">${peso(monthIn)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Out This Month</div>
        <div class="stat-value mono" style="color:var(--accent);">${peso(monthTotal)}</div>
      </div>
      <div class="stat-card wide">
        <div class="stat-label">${net < 0 ? "Short This Month" : "Left This Month"}</div>
        <div class="stat-value mono" style="color:${net < 0 ? 'var(--red)' : 'var(--text)'};">${peso(Math.abs(net))}</div>
        <div class="settings-sub">${monthIn > 0 ? `${spentShare}% of what came in has gone out` : "Nothing received yet this month"}${savedThisMonth > 0 ? `, including ${peso(savedThisMonth)} set aside` : ""}</div>
      </div>
      ` : `
      <div class="stat-card">
        <div class="stat-label">This Month</div>
        <div class="stat-value mono" style="color:var(--accent);">${peso(monthTotal)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">All Time</div>
        <div class="stat-value mono">${peso(spend.reduce((s,e)=>s+e.amount,0))}</div>
      </div>
      `}
      ${hasSavings && !hasIncome ? `
      <div class="stat-card wide">
        <div class="stat-label">Set Aside This Month</div>
        <div class="stat-value mono" style="color:var(--green);">${peso(savedThisMonth)}</div>
        <div class="settings-sub">Savings and investments, kept out of spending totals</div>
      </div>` : ""}
    </div>
    ${srcTotals.length ? `
    <div class="section-label">Where It Came From</div>
    <div class="card">
      ${srcTotals.map(c => `
        <div class="cat-row">
          <div class="cat-head">
            <span class="cat-name"><span class="dot" style="background:${colorFor(c.name)};"></span>${escapeHtml(c.name)}</span>
            <span class="mono">${peso(c.value)}</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct(c.value,maxSrc)}%; background:${colorFor(c.name)};"></div></div>
        </div>
      `).join("")}
    </div>` : ""}
    <div class="section-label">Spending, Last 30 Days</div>
    <div class="card">${buildLineChart(trendData, 500, 160)}</div>
    <div class="section-label">Where It Went</div>
    <div class="card">
      ${catTotals.length ? catTotals.map(c => `
        <div class="cat-row">
          <button class="cat-head" data-cat-row="${escapeHtml(c.name)}">
            <span class="cat-name">
              <span class="dot" style="background:${colorFor(c.name)};"></span>${escapeHtml(c.name)}
              <span class="chev">${expandedCat===c.name ? "▾" : "▸"}</span>
            </span>
            <span class="mono">${peso(c.value)}</span>
          </button>
          <div class="bar-track"><div class="bar-fill" style="width:${pct(c.value,maxCat)}%; background:${colorFor(c.name)};"></div></div>
          ${expandedCat===c.name ? subRowsFor(c.name) : ""}
        </div>
      `).join("") : `<div class="empty">Nothing logged this month</div>`}
    </div>
    ${renderBreakdown(monthSpend)}
    <div class="section-label">${entries.some(isIncome) ? "In vs Out by Month" : "Monthly Trend"}</div>
    <div class="card">${buildGroupedBarChart(monthlyBars, 500, 150)}</div>
  `;

  el.querySelectorAll("[data-cat-row]").forEach(btn => btn.addEventListener("click", () => {
    const c = btn.getAttribute("data-cat-row");
    expandedCat = expandedCat === c ? "" : c;
    renderDashboard();
  }));
}

/* ---------- Log ---------- */
function renderLog() {
  const allTags = Array.from(new Set(entries.flatMap(e => e.tags||[]))).sort();
  const byType = entries.filter(e => filterType==="all" || kindOf(e)===filterType);
  const filtered = byType
    .filter(e => filterCat==="All" || e.category===filterCat)
    .filter(e => !filterSub || (e.sub||"") === filterSub)
    .filter(e => !filterTag || (e.tags||[]).includes(filterTag))
    .sort((a,b) => a.date < b.date ? 1 : -1);
  const totalIn = filtered.filter(isIncome).reduce((s,e)=>s+e.amount,0);
  const totalOut = filtered.filter(e => !isIncome(e)).reduce((s,e)=>s+e.amount,0);

  const catList = filterType === "in" ? INCOME_CATEGORIES
    : filterType === "out" ? CATEGORIES
    : CATEGORIES.concat(INCOME_CATEGORIES);

  const subsInUse = filterCat === "All" ? [] :
    Array.from(new Set(
      entries.filter(e => e.category===filterCat).map(e => e.sub).filter(Boolean)
    )).sort();

  let summary;
  if (!filtered.length) summary = "No entries";
  else {
    const bits = [];
    if (totalIn > 0 || filterType === "in") bits.push(`${peso(totalIn)} in`);
    if (totalOut > 0 || filterType === "out" || !bits.length) bits.push(`${peso(totalOut)} out`);
    summary = `${filtered.length} ${filtered.length === 1 ? "entry" : "entries"} · ${bits.join(" · ")}`;
  }

  const el = document.getElementById("logView");
  el.innerHTML = `
    <div class="segmented" style="margin-bottom:12px;">
      <button class="seg-btn ${filterType==='all'?'active':''}" data-type="all">All</button>
      <button class="seg-btn ${filterType==='in'?'active':''}" data-type="in">In</button>
      <button class="seg-btn ${filterType==='out'?'active':''}" data-type="out">Out</button>
    </div>
    <div class="filter-row">
      <button class="chip ${filterCat==='All'?'active':''}" data-cat="All">All</button>
      ${catList.map(c=>`<button class="chip ${filterCat===c?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("")}
    </div>
    ${subsInUse.length ? `<div class="filter-row">
      <button class="chip ${filterSub===''?'active':''}" data-sub="">All ${escapeHtml(filterCat)}</button>
      ${subsInUse.map(s=>`<button class="chip ${filterSub===s?'active':''}" data-sub="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join("")}
    </div>` : ""}
    ${allTags.length ? `<div class="filter-row">
      <button class="chip ${filterTag===''?'active':''}" data-tag="">All tags</button>
      ${allTags.map(t=>`<button class="chip ${filterTag===t?'active':''}" data-tag="${escapeHtml(t)}">#${escapeHtml(t)}</button>`).join("")}
    </div>` : ""}
    <div class="filter-summary">${summary}</div>
    <div class="card">
      ${filtered.length===0 ? `<div class="empty">No entries match</div>` : filtered.map(e => `
        <div class="entry-row">
          <div class="dot" style="background:${colorFor(e.category)};"></div>
          <div style="flex:1; min-width:0;">
            <div class="entry-note">${escapeHtml(e.note || e.sub || e.category)}</div>
            <div class="entry-meta">
              <span>${e.date}</span>
              <span>${escapeHtml(e.sub ? e.category + " · " + e.sub : e.category)}</span>
              ${(e.tags||[]).map(t=>`<span class="tag-pill">#${escapeHtml(t)}</span>`).join("")}
            </div>
          </div>
          <div class="entry-amount mono" style="${isIncome(e) ? 'color:var(--green);' : ''}">${isIncome(e) ? '+' : ''}${peso(e.amount)}</div>
          <button class="del-btn" data-id="${escapeHtml(e.id)}" aria-label="Delete ${escapeHtml(e.note || e.sub || e.category)}">✕</button>
        </div>
      `).join("")}
    </div>
  `;
  el.querySelectorAll("[data-type]").forEach(btn => btn.addEventListener("click", () => {
    filterType = btn.getAttribute("data-type");
    filterCat = "All";
    filterSub = "";
    renderLog();
  }));
  el.querySelectorAll("[data-cat]").forEach(btn => btn.addEventListener("click", () => {
    filterCat = btn.getAttribute("data-cat");
    filterSub = "";
    renderLog();
  }));
  el.querySelectorAll("[data-sub]").forEach(btn => btn.addEventListener("click", () => {
    filterSub = btn.getAttribute("data-sub");
    renderLog();
  }));
  el.querySelectorAll("[data-tag]").forEach(btn => btn.addEventListener("click", () => { filterTag = btn.getAttribute("data-tag"); renderLog(); }));
  el.querySelectorAll(".del-btn").forEach(btn => btn.addEventListener("click", () => {
    const id = btn.getAttribute("data-id");
    let idx = -1;
    for (let i=0;i<entries.length;i++) if (entries[i].id === id) { idx = i; break; }
    if (idx === -1) return;
    const removed = entries[idx];
    entries.splice(idx, 1);
    if (!saveEntries(entries)) { entries.splice(idx, 0, removed); return; }
    renderLog();
    showToast("Deleted", () => {
      entries.splice(idx, 0, removed);
      if (!saveEntries(entries)) { entries.splice(idx, 1); return; }
      renderLog();
    });
  }));
}

/* ---------- Settings: export / import ---------- */
function renderSettings() {

    </div>

    <div class="section-label">Quick Add</div>
    <div class="card">
      ${presets.length ? presets.map(p => `
        <div class="settings-row">
          <div style="min-width:0;">
            <div class="settings-label">
              <span class="dot" style="background:${colorFor(p.category)}; display:inline-block; margin-right:7px;"></span>${escapeHtml(p.label)}
            </div>
            <div class="settings-sub">${kindOf(p)==='in' ? 'In' : 'Out'} · ${peso(p.amount)} · ${escapeHtml(p.sub ? p.category + " · " + p.sub : p.category)}</div>
          </div>
          <button class="del-btn" data-del-preset="${escapeHtml(p.id)}" aria-label="Remove quick add ${escapeHtml(p.label)}">✕</button>
        </div>
      `).join("") : `<div class="quick-empty">Nothing here yet. Add your first repeat entry below.</div>`}
      ${showPresetForm ? `
        <div class="settings-row stack">
          <div class="segmented" style="margin-bottom:6px;">
            <button class="seg-btn ${presetKind==='out'?'active':''}" data-preset-kind="out">Money Out</button>
            <button class="seg-btn ${presetKind==='in'?'active':''}" data-preset-kind="in">Money In</button>
          </div>
          <div class="field-row">
            <span class="field-row-label">Label</span>
            <input id="pLabel" type="text" placeholder="${presetKind==='in' ? 'Weekly allowance' : 'Commute to school'}">
          </div>
          <div class="field-row">
            <span class="field-row-label">Amount</span>
            <input id="pAmount" type="number" inputmode="decimal" placeholder="${presetKind==='in' ? '500' : '36'}" step="0.01">
          </div>
          <div class="field-row">
            <span class="field-row-label">${presetKind==='in' ? 'Source' : 'Category'}</span>
            <select id="pCategory">${catsFor(presetKind).map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("")}</select>
          </div>
          <div class="field-row">
            <span class="field-row-label">${presetKind==='in' ? 'Detail' : 'Subcategory'}</span>
            <select id="pSub">${subOptions(catsFor(presetKind)[0])}</select>
          </div>
          <div class="field-row">

        </div>
      </div>
      <div class="settings-row">

          <div class="settings-sub">If this looks old after an update, close the app fully and reopen</div>

      <div class="settings-row">

          <div class="settings-label">${unlabeled} without a subcategory</div>

        </div>
      </div>` : ""}
      <div class="settings-row">
        <div>
          <div class="settings-label">Erase all entries</div>
          <div class="settings-sub">Quick adds and appearance are kept. This can't be undone.</div>
        </div>
        <button class="btn-pill danger" id="btnErase">Erase</button>
      </div>
    </div>
    <div class="section-label">Spending Categories</div>
    <div class="card">
      ${CATEGORIES.map(c => `
        <div class="settings-row">
          <div>
            <div class="settings-label"><span class="dot" style="background:${CAT_COLORS[c]}; display:inline-block; margin-right:7px;"></span>${c}</div>
            <div class="settings-sub">${(SUBCATS[c]||[]).length} subcategories${NON_SPEND.indexOf(c)>-1 ? " · not counted as spending" : ""}</div>

        </div>
      `).join("")}

    <div class="section-label">Income Sources</div>
    <div class="card">
      ${INCOME_CATEGORIES.map(c => `
        <div class="settings-row">
          <div>
            <div class="settings-label"><span class="dot" style="background:${INCOME_COLORS[c]}; display:inline-block; margin-right:7px;"></span>${escapeHtml(c)}</div>

          </div>

      `).join("")}

  el.querySelectorAll("[data-theme-opt]").forEach(btn => btn.addEventListener("click", () => {
    applyTheme(btn.getAttribute("data-theme-opt"));
    renderSettings();
  }));
  el.querySelectorAll("[data-accent]").forEach(btn => btn.addEventListener("click", () => {
    applyAccent(btn.getAttribute("data-accent"));
    renderSettings();
  }));
  el.querySelectorAll("[data-del-preset]").forEach(btn => btn.addEventListener("click", () => {
    const id = btn.getAttribute("data-del-preset");
    const removed = presets.filter(p => p.id === id)[0];
    presets = presets.filter(p => p.id !== id);
    savePresets(presets);
    renderSettings();
    renderQuickAdd();
    showToast("Quick add removed", () => {
      if (removed) { presets.push(removed); savePresets(presets); renderSettings(); renderQuickAdd(); }
    });
  }));

  el.querySelectorAll("[data-preset-kind]").forEach(btn => btn.addEventListener("click", () => {
    presetKind = btn.getAttribute("data-preset-kind");
    renderSettings();
  }));

  const btnNew = document.getElementById("btnNewPreset");
  if (btnNew) btnNew.addEventListener("click", () => { showPresetForm = true; renderSettings(); });
  const btnCancel = document.getElementById("btnCancelPreset");
  if (btnCancel) btnCancel.addEventListener("click", () => { showPresetForm = false; renderSettings(); });

  const pCat = document.getElementById("pCategory");
  if (pCat) pCat.addEventListener("change", () => {
    document.getElementById("pSub").innerHTML = subOptions(pCat.value);
  });

  const btnSaveNew = document.getElementById("btnSaveNewPreset");
  if (btnSaveNew) btnSaveNew.addEventListener("click", () => {
    const amountVal = parseFloat(document.getElementById("pAmount").value);
    if (isNaN(amountVal) || amountVal <= 0) { showToast("Enter a valid amount"); return; }
    const cat = pCat.value;
    const sub = document.getElementById("pSub").value || "";
    const label = document.getElementById("pLabel").value.trim() || sub || cat;
    presets.push({
      id: "p" + uid(),
      label: label,
      amount: money(amountVal),
      kind: presetKind,
      category: cat,
      sub: sub,
      tags: document.getElementById("pTags").value.split(",").map(t=>t.trim()).filter(Boolean)
    });
    if (!savePresets(presets)) { presets.pop(); return; }
    showPresetForm = false;
    renderSettings();
    renderQuickAdd();
    showToast(`Saved "${label}"`);
  });

  document.getElementById("btnExport").addEventListener("click", () => {
    const payload = {
      app: "Gastos",
      format: 2,
      exportedAt: new Date().toISOString(),
      entries: entries,
      presets: presets,
      settings: { theme: currentTheme(), accent: currentAccent() }
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `gastos-backup-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Exported");
  });
  document.getElementById("btnImport").addEventListener("click", () => {
    document.getElementById("importFile").click();
  });
  document.getElementById("btnErase").addEventListener("click", () => {
    if (confirm("Erase all entries? This cannot be undone.")) {
      const prev = entries;
      entries = [];
      if (!saveEntries(entries)) { entries = prev; return; }
      renderSettings();
      showToast("All data erased");
    }
  });
}

document.getElementById("importFile").addEventListener("change", (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);

      /* Two shapes are accepted:
         format 1: a bare array of entries, written by earlier versions
         format 2: { entries, presets, settings } */
      let inEntries, inPresets = [], inSettings = null;
      if (Array.isArray(parsed)) {
        inEntries = parsed;
      } else if (parsed && Array.isArray(parsed.entries)) {
        inEntries = parsed.entries;
        if (Array.isArray(parsed.presets)) inPresets = parsed.presets;
        if (parsed.settings) inSettings = parsed.settings;
      } else {
        throw new Error("bad format");
      }

      const existingIds = new Set(entries.map(e => e.id));
      const newEntries = inEntries.filter(e => e && e.id && !existingIds.has(e.id));
      const prevEntries = entries;
      const merged = normalizeEntries(entries.concat(newEntries), false);
      if (!saveEntries(merged)) { entries = prevEntries; return; }
      entries = merged;

      const presetIds = new Set(presets.map(p => p.id));
      const newPresets = inPresets.filter(p => p && p.id && !presetIds.has(p.id));
      if (newPresets.length) {
        newPresets.forEach(p => { if (p.kind !== "in" && p.kind !== "out") p.kind = "out"; });
        presets = presets.concat(newPresets);
        savePresets(presets);
      }

      if (inSettings) {
        if (inSettings.theme === "light" || inSettings.theme === "dark" || inSettings.theme === "system") applyTheme(inSettings.theme);
        if (typeof inSettings.accent === "string") applyAccent(inSettings.accent);
      }

      renderQuickAdd();
      render();
      const skipped = inEntries.length - newEntries.length;
      showToast(
        `Restored ${newEntries.length} ${newEntries.length === 1 ? "entry" : "entries"}` +
        (newPresets.length ? `, ${newPresets.length} quick add${newPresets.length === 1 ? "" : "s"}` : "") +
        (skipped ? ` · ${skipped} already here` : "")
      );
    } catch (e) {
      showToast("Couldn't read that file");
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
});

/* ---------- Tabs ---------- */
document.getElementById("tabDashboard").addEventListener("click", () => { currentView="dashboard"; render(); });
document.getElementById("tabLog").addEventListener("click", () => { currentView="log"; render(); });
document.getElementById("tabSettings").addEventListener("click", () => { currentView="settings"; render(); });

function render() {
  document.getElementById("tabDashboard").classList.toggle("active", currentView==="dashboard");
  document.getElementById("tabLog").classList.toggle("active", currentView==="log");
  document.getElementById("tabSettings").classList.toggle("active", currentView==="settings");
  document.getElementById("quickAddCard").style.display = currentView==="dashboard" ? "block" : "none";
  document.getElementById("addFormCard").style.display = currentView==="dashboard" ? "block" : "none";
  if (currentView==="dashboard") renderQuickAdd();
  document.getElementById("dashboardView").style.display = currentView==="dashboard" ? "block" : "none";
  document.getElementById("logView").style.display = currentView==="log" ? "block" : "none";
  document.getElementById("settingsView").style.display = currentView==="settings" ? "block" : "none";
  if (currentView==="dashboard") renderDashboard();
  else if (currentView==="log") renderLog();
  else renderSettings();
}

/* ---------- Quick-add via URL (for Shortcuts) ---------- */
function handleQuickAdd() {
  const params = new URLSearchParams(window.location.search);
  const amt = parseFloat(params.get("amt"));
  if (!isNaN(amt) && amt > 0) {
    const kind = params.get("kind") === "in" ? "in" : "out";
    const rawCat = params.get("cat") || (kind === "in" ? "Other Income" : "Other");
    const cat = catsFor(kind).indexOf(rawCat) > -1 ? rawCat : (kind === "in" ? "Other Income" : "Other");
    const rawSub = params.get("sub") || "";
    const sub = subMeta(cat, rawSub) ? rawSub : "";
    const note = params.get("note") || "";
    const tags = (params.get("tags") || "").split(",").map(t=>t.trim()).filter(Boolean);
    const date = params.get("date") || todayStr();
    entries.unshift({
      id: uid(),
      amount: money(amt),
      kind: kind,
      category: cat,
      sub, note, tags, date
    });
    if (!saveEntries(entries)) { entries.shift(); return; }
    history.replaceState(null, "", window.location.pathname);
    setTimeout(() => showToast(`${kind === "in" ? "Received" : "Added"} ${peso(amt)} · ${sub || cat}`), 300);
  }
}

syncMetaTheme();
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", syncMetaTheme);
  else if (mq.addListener) mq.addListener(syncMetaTheme);
}

handleQuickAdd();
renderAddForm();
render();

if ("serviceWorker" in navigator) {
  /* Was this page already under a service worker? If not, this is a first
     install and the handover below is expected rather than an update. */
  const wasControlled = !!navigator.serviceWorker.controller;

  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (wasControlled) showToast("Update installed. Close and reopen Gastos.");
  });

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").then((reg) => {
      /* Ask for a fresh copy of sw.js on every launch. Without this the
         update check can lag behind a push for as long as the CDN caches it. */
      if (reg.update) reg.update().catch(() => {});
    }).catch(() => {});
  });
}
</script>
