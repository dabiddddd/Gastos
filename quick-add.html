<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Quick Add</title>
<link rel="manifest" href="./manifest.json">
<style>
  :root {
    --bg: #000000; --card: #1c1c1e; --text: #f2f2f7; --text-secondary: #8e8e93;
    --border: #2c2c2e; --accent: #ff9f0a; --green: #34c759;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    min-height: 100vh; padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    display: flex; flex-direction: column;
  }
  .title { font-size: 20px; font-weight: 700; text-align: center; padding: 16px 0 8px; }
  .amount-display {
    text-align: center; font-size: 56px; font-weight: 700; letter-spacing: -0.02em;
    padding: 20px 0; font-variant-numeric: tabular-nums;
  }
  .amount-display .peso { color: var(--text-secondary); font-size: 32px; margin-right: 4px; }
  .keypad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    max-width: 320px; margin: 0 auto; width: 100%;
  }
  .key {
    background: var(--card); border: none; border-radius: 14px;
    font-size: 26px; font-weight: 500; color: var(--text); padding: 18px 0;
  }
  .key:active { background: var(--border); }
  .key.func { color: var(--accent); font-size: 20px; }
  .cats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    margin: 24px auto 0; max-width: 360px; width: 100%;
  }
  .cat-btn {
    background: var(--card); border: 2px solid transparent; border-radius: 12px;
    padding: 10px 4px; font-size: 12px; font-weight: 600; color: var(--text-secondary);
  }
  .cat-btn.selected { border-color: var(--accent); color: var(--text); }
  .btn-save {
    margin: 24px auto 12px; max-width: 360px; width: 100%;
    background: var(--accent); border: none; border-radius: 14px;
    padding: 16px; font-size: 17px; font-weight: 700; color: #000;
  }
  .btn-save:disabled { opacity: 0.3; }
  .link-full {
    text-align: center; font-size: 13px; color: var(--text-secondary);
    padding: 8px 0 20px; text-decoration: none;
  }
  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: var(--green); color: #000; padding: 16px 28px; border-radius: 14px;
    font-size: 17px; font-weight: 700; opacity: 0; transition: opacity 0.2s;
    pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="title">Quick Add</div>
  <div class="amount-display"><span class="peso">₱</span><span id="display">0</span></div>

  <div class="keypad" id="keypad"></div>

  <div class="cats" id="cats"></div>

  <button class="btn-save" id="btnSave" disabled>Save Expense</button>
  <a class="link-full" href="./expense-tracker.html">Open full app →</a>

  <div class="toast" id="toast">Saved ✓</div>

<script>
const CATEGORIES = ["Food","Transport","Bills","Training","Shopping","School","Health","Other"];
const STORE_KEY = "gastos_entries_v1";
let amountStr = "";
let selectedCat = "Food";

function todayStr() { return new Date().toISOString().slice(0,10); }
function loadEntries() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch(e) { return []; } }
function saveEntries(entries) { localStorage.setItem(STORE_KEY, JSON.stringify(entries)); }

const keys = ["1","2","3","4","5","6","7","8","9",".","0","⌫"];
const keypadEl = document.getElementById("keypad");
keys.forEach(k => {
  const btn = document.createElement("button");
  btn.className = "key" + (k === "⌫" ? " func" : "");
  btn.textContent = k;
  btn.addEventListener("click", () => {
    if (k === "⌫") { amountStr = amountStr.slice(0, -1); }
    else if (k === "." && amountStr.includes(".")) { /* skip */ }
    else if (amountStr.length < 8) { amountStr += k; }
    updateDisplay();
  });
  keypadEl.appendChild(btn);
});

const catsEl = document.getElementById("cats");
CATEGORIES.forEach(c => {
  const btn = document.createElement("button");
  btn.className = "cat-btn" + (c === selectedCat ? " selected" : "");
  btn.textContent = c;
  btn.addEventListener("click", () => {
    selectedCat = c;
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
  });
  catsEl.appendChild(btn);
});

function updateDisplay() {
  document.getElementById("display").textContent = amountStr || "0";
  const val = parseFloat(amountStr);
  document.getElementById("btnSave").disabled = !(val > 0);
}

document.getElementById("btnSave").addEventListener("click", () => {
  const amt = parseFloat(amountStr);
  if (!(amt > 0)) return;
  const entries = loadEntries();
  entries.unshift({
    id: Date.now().toString(),
    amount: amt,
    category: selectedCat,
    note: "",
    tags: [],
    date: todayStr()
  });
  saveEntries(entries);
  const toast = document.getElementById("toast");
  toast.classList.add("show");
  amountStr = "";
  updateDisplay();
  setTimeout(() => toast.classList.remove("show"), 900);
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
