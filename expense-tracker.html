<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gastos</title>
<link rel="manifest" href="./manifest.json">
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --text-secondary: #8e8e93;
    --border: #e5e5ea;
    --accent: #d9822b;
    --accent-soft: rgba(217,130,43,0.1);
    --green: #34c759;
    --red: #ff3b30;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --text-secondary: #8e8e93;
      --border: #2c2c2e;
      --accent: #ff9f0a;
      --accent-soft: rgba(255,159,10,0.15);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh; padding-bottom: env(safe-area-inset-bottom);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  input, select, button, textarea { font-family: inherit; }
  input::placeholder { color: var(--text-secondary); }
  button { cursor: pointer; -webkit-appearance: none; appearance: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 0 40px; }

  /* Nav */
  .nav {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 0.5px solid var(--border);
    padding: 14px 20px 12px;
  }
  .nav-title { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 12px; }
  .segmented {
    display: flex; background: var(--border); border-radius: 9px; padding: 2px;
  }
  .seg-btn {
    flex: 1; border: none; background: transparent; padding: 6px 0;
    font-size: 13px; font-weight: 600; color: var(--text-secondary);
    border-radius: 7px; transition: all 0.2s;
  }
  .seg-btn.active { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

  .content { padding: 16px 16px 0; }

  /* Cards */
  .card {
    background: var(--card); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px;
  }
  .section-label {
    font-size: 12px; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.03em; margin: 20px 4px 8px;
  }
  .section-label:first-child { margin-top: 4px; }

  /* Add form */
  .amount-input-row { display: flex; align-items: baseline; gap: 4px; padding: 4px 0 14px; border-bottom: 0.5px solid var(--border); margin-bottom: 14px; }
  .peso-sign { font-size: 28px; font-weight: 600; color: var(--text-secondary); }
  #fAmount {
    border: none; background: transparent; font-size: 34px; font-weight: 700;
    color: var(--text); width: 100%; outline: none; letter-spacing: -0.02em;
  }
  .field-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 0; border-bottom: 0.5px solid var(--border);
  }
  .field-row:last-of-type { border-bottom: none; }
  .field-row-label { font-size: 15px; color: var(--text); }
  .field-row select, .field-row input {
    border: none; background: transparent; color: var(--text-secondary);
    font-size: 15px; text-align: right; outline: none; max-width: 60%;
  }
  .field-row input[type="date"] { color: var(--text-secondary); }
  .field-row input::placeholder { text-align: right; }
  .btn-add {
    width: 100%; margin-top: 14px; background: var(--accent); border: none;
    border-radius: 12px; padding: 13px; color: white; font-weight: 600; font-size: 16px;
  }
  .btn-add:active { opacity: 0.7; }
  .btn-add:disabled { opacity: 0.35; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-card { background: var(--card); border-radius: var(--radius); padding: 16px; }
  .stat-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 6px; }
  .stat-value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }

  .chart-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  svg.chart { width: 100%; height: auto; display: block; }

  .cat-row { margin-bottom: 12px; }
  .cat-row:last-child { margin-bottom: 0; }
  .cat-row-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
  .cat-name { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .bar-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; }

  /* Filters */
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; }
  .chip {
    flex-shrink: 0; padding: 6px 14px; border-radius: 16px; border: none;
    background: var(--card); color: var(--text); font-size: 13px; font-weight: 500;
    border: 0.5px solid var(--border);
  }
  .chip.active { background: var(--accent); color: white; border-color: var(--accent); }
  .filter-summary { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; padding: 0 4px; }

  .entry-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 0.5px solid var(--border); }
  .entry-row:last-child { border-bottom: none; }
  .entry-note { font-size: 15px; font-weight: 500; }
  .entry-meta { font-size: 12px; color: var(--text-secondary); display: flex; gap: 6px; margin-top: 2px; flex-wrap: wrap; }
  .tag-pill { color: var(--accent); }
  .del-btn { background: transparent; border: none; color: var(--red); font-size: 20px; padding: 4px 6px; line-height: 1; }
  .entry-amount { font-size: 15px; font-weight: 600; white-space: nowrap; }

  .empty { color: var(--text-secondary); font-size: 14px; text-align: center; padding: 36px 16px; }

  /* Settings row / export-import */
  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 0; border-bottom: 0.5px solid var(--border);
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-label { font-size: 15px; }
  .settings-sub { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
  .btn-pill {
    background: var(--accent-soft); color: var(--accent); border: none;
    border-radius: 8px; padding: 7px 14px; font-size: 14px; font-weight: 600;
  }
  .btn-pill.danger { background: rgba(255,59,48,0.1); color: var(--red); }
  #importFile { display: none; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px;
    font-size: 14px; font-weight: 500; opacity: 0; transition: opacity 0.25s;
    pointer-events: none; z-index: 100; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <div class="nav-title">Gastos</div>
    <div class="segmented">
      <button class="seg-btn active" id="tabDashboard">Dashboard</button>
      <button class="seg-btn" id="tabLog">Log</button>
      <button class="seg-btn" id="tabSettings">Settings</button>
    </div>
  </div>

  <div class="content">
    <div id="addFormCard"></div>
    <div id="dashboardView"></div>
    <div id="logView" style="display:none;"></div>
    <div id="settingsView" style="display:none;"></div>
  </div>
</div>

<input type="file" id="importFile" accept="application/json">
<div class="toast" id="toast"></div>

<script>
const CATEGORIES = ["Food","Transport","Bills","Training","Shopping","School","Health","Other"];
const CAT_COLORS = {
  Food:"#ff9f0a", Transport:"#30b0c7", Bills:"#ff453a", Training:"#5e5ce6",
  Shopping:"#bf5af2", School:"#32d74b", Health:"#ff375f", Other:"#8e8e93"
};
const STORE_KEY = "gastos_entries_v1";

function peso(n) {
  return "₱" + Number(n||0).toLocaleString("en-PH", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function todayStr() { return new Date().toISOString().slice(0,10); }
function monthKey(d) { return d.slice(0,7); }
function loadEntries() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e) { return []; }
}
function saveEntries(entries) { localStorage.setItem(STORE_KEY, JSON.stringify(entries)); }
function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

let entries = loadEntries();
let filterCat = "All";
let filterTag = "";
let currentView = "dashboard";

/* ---------- Add form ---------- */
function renderAddForm() {
  const el = document.getElementById("addFormCard");
  el.innerHTML = `
    <div class="card">
      <div class="amount-input-row">
        <span class="peso-sign">₱</span>
        <input id="fAmount" type="number" inputmode="decimal" placeholder="0.00" step="0.01">
      </div>
      <div class="field-row">
        <span class="field-row-label">Category</span>
        <select id="fCategory">
          ${CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join("")}
        </select>
      </div>
      <div class="field-row">
        <span class="field-row-label">Date</span>
        <input id="fDate" type="date" value="${todayStr()}">
      </div>
      <div class="field-row">
        <span class="field-row-label">Note</span>
        <input id="fNote" type="text" placeholder="Optional">
      </div>
      <div class="field-row">
        <span class="field-row-label">Tags</span>
        <input id="fTags" type="text" placeholder="comma, separated">
      </div>
      <button class="btn-add" id="btnAdd">Add Expense</button>
    </div>
  `;
  document.getElementById("btnAdd").addEventListener("click", () => {
    const amountVal = parseFloat(document.getElementById("fAmount").value);
    if (isNaN(amountVal) || amountVal <= 0) { showToast("Enter a valid amount"); return; }
    const entry = {
      id: Date.now().toString(),
      amount: amountVal,
      category: document.getElementById("fCategory").value,
      note: document.getElementById("fNote").value.trim(),
      tags: document.getElementById("fTags").value.split(",").map(t=>t.trim()).filter(Boolean),
      date: document.getElementById("fDate").value || todayStr()
    };
    entries.unshift(entry);
    saveEntries(entries);
    showToast("Added");
    renderAddForm();
    render();
  });
}

/* ---------- Charts (inline SVG, no deps) ---------- */
function buildLineChart(data, width, height) {
  if (data.length === 0) return `<div class="empty">No entries yet</div>`;
  const padL = 42, padB = 20, padT = 10, padR = 8;
  const w = width - padL - padR, h = height - padT - padB;
  const maxVal = Math.max(...data.map(d => d.amount), 1);
  const stepX = data.length > 1 ? w / (data.length - 1) : 0;
  const points = data.map((d,i) => [padL + i*stepX, padT + h - (d.amount/maxVal)*h]);
  const pathD = points.map((p,i) => (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const areaD = pathD + ` L${points[points.length-1][0].toFixed(1)},${(padT+h).toFixed(1)} L${points[0][0].toFixed(1)},${(padT+h).toFixed(1)} Z`;
  let gridLines = "";
  for (let i=0;i<=2;i++){
    const y = padT + (h/2)*i;
    const val = Math.round(maxVal - (maxVal/2)*i);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${width-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    gridLines += `<text x="${padL-6}" y="${y+3}" fill="var(--text-secondary)" font-size="9" text-anchor="end">${val}</text>`;
  }
  const labelEvery = Math.max(1, Math.ceil(data.length/5));
  let xLabels = "";
  data.forEach((d,i) => {
    if (i % labelEvery === 0 || i === data.length-1) {
      xLabels += `<text x="${points[i][0]}" y="${height-4}" fill="var(--text-secondary)" font-size="9" text-anchor="middle">${d.label}</text>`;
    }
  });
  return `<svg class="chart" viewBox="0 0 ${width} ${height}">
    ${gridLines}
    <path d="${areaD}" fill="var(--accent)" opacity="0.12"/>
    <path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function buildBarChart(data, width, height) {
  if (data.length === 0) return `<div class="empty">Not enough data yet</div>`;
  const padL = 42, padB = 20, padT = 10, padR = 8;
  const w = width - padL - padR, h = height - padT - padB;
  const maxVal = Math.max(...data.map(d => d.total), 1);
  const gap = w / data.length;
  const bw = gap * 0.5;
  let bars = "";
  data.forEach((d,i) => {
    const barH = (d.total/maxVal)*h;
    const x = padL + i*gap + (gap-bw)/2;
    const y = padT + h - barH;
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(barH,2)}" fill="var(--accent)" rx="4"/>`;
    bars += `<text x="${x+bw/2}" y="${height-4}" fill="var(--text-secondary)" font-size="9" text-anchor="middle">${d.month.slice(5)}</text>`;
  });
  let gridLines = "";
  for (let i=0;i<=2;i++){
    const y = padT + (h/2)*i;
    const val = Math.round(maxVal - (maxVal/2)*i);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${width-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    gridLines += `<text x="${padL-6}" y="${y+3}" fill="var(--text-secondary)" font-size="9" text-anchor="end">${val}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${width} ${height}">${gridLines}${bars}</svg>`;
}

/* ---------- Dashboard ---------- */
function renderDashboard() {
  const thisMonth = monthKey(todayStr());
  const monthTotal = entries.filter(e => monthKey(e.date)===thisMonth).reduce((s,e)=>s+e.amount,0);
  const allTimeTotal = entries.reduce((s,e)=>s+e.amount,0);

  const catMap = {};
  entries.filter(e => monthKey(e.date)===thisMonth).forEach(e => { catMap[e.category] = (catMap[e.category]||0) + e.amount; });
  const catTotals = CATEGORIES.map(c => ({name:c, value:catMap[c]||0})).filter(c=>c.value>0).sort((a,b)=>b.value-a.value);
  const maxCat = catTotals.length ? catTotals[0].value : 1;

  const dailyMap = {};
  entries.forEach(e => { dailyMap[e.date] = (dailyMap[e.date]||0) + e.amount; });
  const sortedDates = Object.keys(dailyMap).sort().slice(-30);
  const trendData = sortedDates.map(d => ({label: d.slice(5), amount: dailyMap[d]}));

  const monthMap = {};
  entries.forEach(e => { const mk = monthKey(e.date); monthMap[mk] = (monthMap[mk]||0) + e.amount; });
  const monthlyBars = Object.keys(monthMap).sort().slice(-6).map(k => ({month:k, total:monthMap[k]}));

  const el = document.getElementById("dashboardView");
  el.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">This Month</div>
        <div class="stat-value mono" style="color:var(--accent);">${peso(monthTotal)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">All Time</div>
        <div class="stat-value mono">${peso(allTimeTotal)}</div>
      </div>
    </div>
    <div class="section-label">Last 30 Days</div>
    <div class="card">${buildLineChart(trendData, 500, 160)}</div>
    <div class="section-label">By Category</div>
    <div class="card">
      ${catTotals.length ? catTotals.map(c => `
        <div class="cat-row">
          <div class="cat-row-top">
            <span class="cat-name"><span class="dot" style="background:${CAT_COLORS[c.name]};"></span>${c.name}</span>
            <span class="mono">${peso(c.value)}</span>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${(c.value/maxCat)*100}%; background:${CAT_COLORS[c.name]};"></div></div>
        </div>
      `).join("") : `<div class="empty">Nothing logged this month</div>`}
    </div>
    <div class="section-label">Monthly Trend</div>
    <div class="card">${buildBarChart(monthlyBars, 500, 150)}</div>
  `;
}

/* ---------- Log ---------- */
function renderLog() {
  const allTags = Array.from(new Set(entries.flatMap(e => e.tags||[]))).sort();
  const filtered = entries
    .filter(e => filterCat==="All" || e.category===filterCat)
    .filter(e => !filterTag || (e.tags||[]).includes(filterTag))
    .sort((a,b) => a.date < b.date ? 1 : -1);
  const filteredTotal = filtered.reduce((s,e)=>s+e.amount,0);

  const el = document.getElementById("logView");
  el.innerHTML = `
    <div class="filter-row">
      <button class="chip ${filterCat==='All'?'active':''}" data-cat="All">All</button>
      ${CATEGORIES.map(c=>`<button class="chip ${filterCat===c?'active':''}" data-cat="${c}">${c}</button>`).join("")}
    </div>
    ${allTags.length ? `<div class="filter-row">
      <button class="chip ${filterTag===''?'active':''}" data-tag="">All tags</button>
      ${allTags.map(t=>`<button class="chip ${filterTag===t?'active':''}" data-tag="${escapeHtml(t)}">#${escapeHtml(t)}</button>`).join("")}
    </div>` : ""}
    <div class="filter-summary">${filtered.length} entries · ${peso(filteredTotal)}</div>
    <div class="card">
      ${filtered.length===0 ? `<div class="empty">No entries match</div>` : filtered.map(e => `
        <div class="entry-row">
          <div class="dot" style="background:${CAT_COLORS[e.category]};"></div>
          <div style="flex:1; min-width:0;">
            <div class="entry-note">${escapeHtml(e.note || e.category)}</div>
            <div class="entry-meta">
              <span>${e.date}</span><span>${e.category}</span>
              ${(e.tags||[]).map(t=>`<span class="tag-pill">#${escapeHtml(t)}</span>`).join("")}
            </div>
          </div>
          <div class="entry-amount mono">${peso(e.amount)}</div>
          <button class="del-btn" data-id="${e.id}">✕</button>
        </div>
      `).join("")}
    </div>
  `;
  el.querySelectorAll("[data-cat]").forEach(btn => btn.addEventListener("click", () => { filterCat = btn.getAttribute("data-cat"); renderLog(); }));
  el.querySelectorAll("[data-tag]").forEach(btn => btn.addEventListener("click", () => { filterTag = btn.getAttribute("data-tag"); renderLog(); }));
  el.querySelectorAll(".del-btn").forEach(btn => btn.addEventListener("click", () => {
    entries = entries.filter(e => e.id !== btn.getAttribute("data-id"));
    saveEntries(entries);
    renderLog();
    showToast("Deleted");
  }));
}

/* ---------- Settings: export / import ---------- */
function renderSettings() {
  const el = document.getElementById("settingsView");
  el.innerHTML = `
    <div class="section-label">Backup & Transfer</div>
    <div class="card">
      <div class="settings-row">
        <div>
          <div class="settings-label">Export data</div>
          <div class="settings-sub">Save all entries as a JSON file</div>
        </div>
        <button class="btn-pill" id="btnExport">Export</button>
      </div>
      <div class="settings-row">
        <div>
          <div class="settings-label">Import data</div>
          <div class="settings-sub">Load entries from a backup file</div>
        </div>
        <button class="btn-pill" id="btnImport">Import</button>
      </div>
    </div>
    <div class="section-label">Data</div>
    <div class="card">
      <div class="settings-row">
        <div>
          <div class="settings-label">${entries.length} entries stored</div>
          <div class="settings-sub">Saved locally on this device only</div>
        </div>
      </div>
      <div class="settings-row">
        <div>
          <div class="settings-label">Erase all data</div>
          <div class="settings-sub">This can't be undone</div>
        </div>
        <button class="btn-pill danger" id="btnErase">Erase</button>
      </div>
    </div>
  `;
  document.getElementById("btnExport").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(entries, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `gastos-backup-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Exported");
  });
  document.getElementById("btnImport").addEventListener("click", () => {
    document.getElementById("importFile").click();
  });
  document.getElementById("btnErase").addEventListener("click", () => {
    if (confirm("Erase all entries? This cannot be undone.")) {
      entries = [];
      saveEntries(entries);
      renderSettings();
      showToast("All data erased");
    }
  });
}

document.getElementById("importFile").addEventListener("change", (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (!Array.isArray(imported)) throw new Error("bad format");
      const existingIds = new Set(entries.map(e => e.id));
      const merged = entries.concat(imported.filter(e => e && e.id && !existingIds.has(e.id)));
      entries = merged;
      saveEntries(entries);
      renderSettings();
      showToast(`Imported ${imported.length} entries`);
    } catch (e) {
      showToast("Couldn't read that file");
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
});

/* ---------- Tabs ---------- */
document.getElementById("tabDashboard").addEventListener("click", () => { currentView="dashboard"; render(); });
document.getElementById("tabLog").addEventListener("click", () => { currentView="log"; render(); });
document.getElementById("tabSettings").addEventListener("click", () => { currentView="settings"; render(); });

function render() {
  document.getElementById("tabDashboard").classList.toggle("active", currentView==="dashboard");
  document.getElementById("tabLog").classList.toggle("active", currentView==="log");
  document.getElementById("tabSettings").classList.toggle("active", currentView==="settings");
  document.getElementById("addFormCard").style.display = currentView==="dashboard" ? "block" : "none";
  document.getElementById("dashboardView").style.display = currentView==="dashboard" ? "block" : "none";
  document.getElementById("logView").style.display = currentView==="log" ? "block" : "none";
  document.getElementById("settingsView").style.display = currentView==="settings" ? "block" : "none";
  if (currentView==="dashboard") renderDashboard();
  else if (currentView==="log") renderLog();
  else renderSettings();
}

/* ---------- Quick-add via URL (for Shortcuts) ---------- */
function handleQuickAdd() {
  const params = new URLSearchParams(window.location.search);
  const amt = parseFloat(params.get("amt"));
  if (!isNaN(amt) && amt > 0) {
    const cat = params.get("cat") || "Other";
    const note = params.get("note") || "";
    const tags = (params.get("tags") || "").split(",").map(t=>t.trim()).filter(Boolean);
    const date = params.get("date") || todayStr();
    entries.unshift({
      id: Date.now().toString(),
      amount: amt,
      category: CATEGORIES.includes(cat) ? cat : "Other",
      note, tags, date
    });
    saveEntries(entries);
    history.replaceState(null, "", window.location.pathname);
    setTimeout(() => showToast(`Added ${peso(amt)} to ${cat}`), 300);
  }
}

handleQuickAdd();
renderAddForm();
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
